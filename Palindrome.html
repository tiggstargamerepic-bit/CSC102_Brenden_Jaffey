<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome Checker</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="container">
        <h1>Palindrome Checker</h1>
        
        <form onsubmit="return checkPalindrome()">
            <p id="stepUpText">Put any word into the box and submit to see if it is a palindrome</p>
            <input type="text" id="userInput" placeholder="Enter a word..." required>
            <button type="submit">Check Word</button>
        </form>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
